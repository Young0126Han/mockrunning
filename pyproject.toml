[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-location-controller"
version = "0.2.0"
description = "Windows controller for iPhone location simulation in owned/test devices"
requires-python = ">=3.11"
dependencies = ["pymobiledevice3>=11.15.5,<12"]

[project.scripts]
ios-location = "ios_location_controller.cli:main"
ios-location-map = "ios_location_controller.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ios_location_controller = ["static/*", "static/images/*"]

[tool.pytest.ini_options]
addopts = "-p no:xonsh"
testpaths = ["tests"]
